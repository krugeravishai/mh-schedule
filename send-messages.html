<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="icons/yeshiva-logo.png" type="image/png">    
    <title>שליחת הודעות</title>
    <link rel="stylesheet" href="send-messages.css">
  </head>

  <img id="logo" src="icons/yeshiva-logo.png" alt="Image" style="width:40px; position:fixed; top:10px; left:10px;">
  

    <!--code to run sidemenu-->
    <script>
    let adminMenuOpen = false;
    function toggleAdminMenu(){
    const menu = document.getElementById("adminMenu");
    if(adminMenuOpen){
        menu.style.transform = "translateX(100%)";
    }else{
        menu.style.transform = "translateX(0)";
    }
    adminMenuOpen = !adminMenuOpen;
    }
    </script>

<body>
    <!--code to add the side menu-->
    <div id="adminMenuButton"
    onclick="toggleAdminMenu()"
    style="position:fixed; top:10px; right:10px; font-size:28px; cursor:pointer; z-index:3000;">
    ☰
    </div>
    <div id="adminMenu"
    style="
    position:fixed;
    top:0;
    right:0;
    width:260px;
    height:100%;
    background:#ffffff;
    box-shadow:-2px 0 10px rgba(0,0,0,0.2);
    padding:20px;
    transform:translateX(100%);
    transition:transform 0.25s ease;
    z-index:2000;
    ">
    <h2 style="margin-top:20px;">ניהול</h2>
    <div style="display:flex; flex-direction:column; gap:12px;">
    <a href="index.html"><button class="btn-full">🏠הלו"ז</button></a>
    <a href="send-messages.html"><button class="btn-full">📩שליחת הודעות</button></a>
    <a href="edit-settings.html"><button class="btn-full">⚙️עריכת הגדרות</button></a>
    <a href="edit-schedule.html"><button class="btn-full">🗓️עריכת סדר יום</button></a>
    </div>
    </div>


  <h1>שליחת הודעות:</h1>
    <label>טקסט ההודעה:
      <textarea id="messageText" rows="2"></textarea>
    </label>
<!--
    <label>שיעור:
      <select id="grade">
        <option value="everyone">כולם</option>
        <option value="1">שיעור א</option>
        <option value="2-3">שיעור ב-ג</option>
        <option value="4-5">שיעור ד-ה</option>
        <option value="4">שיעור ד</option>
        <option value="5">שיעור ה</option>
        <option value="6">שיעור ו</option>
        <option value="older">בוגרים</option> 
      </select>
    </label>
-->
    <label>שעת התחלת ההודעה:
      <input type="datetime-local" id="startTime">
    </label>

    <label>שעת סיום ההודעה:
      <input type="datetime-local" id="endTime">
    </label>

    <label>הודעה שקטה:
      <div id="silentToggle" class="chip">לא שקט</div>
      <input type="hidden" id="silent" value="false" />
    </label>

    <button id="sendButton" class="btn-full">שלח הודעה</button>

    <div id="currentSection">
      <h1 class="message-grid-title">הודעות המופיעות כעת:</h1>
      <div id="currentMessageGrid" class="message-grid"></div>
    </div>

    <div id="futureSection">
      <h1 class="message-grid-title">הודעות מתוזמנות:</h1>
      <div id="futureMessageGrid" class="message-grid"></div>
    </div>


    <div id="toast" class="toast"></div>

  
    <script type="module" src="send-messages.js"></script>
  </body>
</html>
